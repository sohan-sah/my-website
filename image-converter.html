<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Image Converter</title>
<style>
  :root{ --ink:#1c1b19; --paper:#f6f4ee; --line:#dedad0; --accent:#3d5a45; --accent2:#b0521f; --panel:#ffffff; --mut:#8a8578; --ok:#3d5a45; --bad:#a8402c; --warn:#b0521f; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; min-height:100vh; }
  header{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--paper); z-index:5; }
  header h1{ font-size:15px; margin:0; font-weight:700; } header h1 span{ color:var(--accent2); }
  button{ font-family:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:7px 12px; font-size:12.5px; }
  button:hover{ border-color:var(--accent); } button:disabled{ opacity:.4; cursor:not-allowed; }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  main{ flex:1; padding:14px; max-width:640px; margin:0 auto; width:100%; }
  .dropzone{ border:2px dashed var(--line); border-radius:12px; padding:28px 14px; text-align:center; color:var(--mut); }
  .dropzone label{ display:inline-block; margin-top:10px; padding:9px 18px; background:var(--accent); color:#fff; border-radius:8px; cursor:pointer; font-size:13.5px; }
  input[type=file]{ display:none; }
  .settings{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:14px; }
  .row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .row label{ width:96px; font-size:12.5px; color:var(--mut); flex-shrink:0; }
  .row select, .row input[type=number]{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  .row input[type=range]{ flex:1; accent-color:var(--accent); }
  .row .val{ width:38px; text-align:right; font-size:12px; color:var(--mut); }
  .format-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .format-grid button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .queue{ margin-top:16px; }
  .queue h2{ font-size:12.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .item{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; }
  .item img{ width:44px; height:44px; object-fit:cover; border-radius:6px; background:#eee; flex-shrink:0; }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .meta{ font-size:11px; color:var(--mut); }
  .status{ font-size:10.5px; padding:2px 8px; border-radius:10px; flex-shrink:0; }
  .status.queued{ background:#e5e1d5; color:var(--mut); }
  .status.processing{ background:#fde9d2; color:var(--warn); }
  .status.complete{ background:#dcead8; color:var(--ok); }
  .status.failed{ background:#f6d9d3; color:var(--bad); }
  .item .dl{ padding:5px 9px; font-size:11px; flex-shrink:0; }
  .actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .actions button{ flex:1; }
  #summary{ font-size:12px; color:var(--mut); margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Image<span>Converter</span></h1>
  <button id="clearBtn">Clear</button>
</header>
<main>
  <div class="dropzone" id="dropzone">
    <div>Drop images here or choose files (single or multiple for batch)</div>
    <label>Choose Images<input type="file" id="fileInput" accept="image/*" multiple></label>
  </div>

  <div class="settings">
    <div class="row"><label>Output format</label></div>
    <div class="format-grid" id="formatGrid">
      <button data-fmt="jpeg" class="active">JPG</button>
      <button data-fmt="png">PNG</button>
      <button data-fmt="webp">WebP</button>
      <button data-fmt="bmp">BMP</button>
    </div>
    <div class="row" style="margin-top:12px"><label>Quality</label><input type="range" id="quality" min="10" max="100" value="85"><span class="val" id="v-quality">85%</span></div>
    <div class="row"><label>Resize width</label><input type="number" id="resizeW" placeholder="original" style="flex:1"></div>
    <div class="row"><label>Resize height</label><input type="number" id="resizeH" placeholder="original" style="flex:1"></div>
    <div class="row"><label>Keep aspect</label><input type="checkbox" id="keepAspect" checked></div>
  </div>

  <div class="actions">
    <button id="convertBtn" class="primary" disabled>Convert All</button>
    <button id="downloadAllBtn" disabled>Download All (.zip)</button>
  </div>
  <div id="summary"></div>

  <div class="queue">
    <h2>Queue</h2>
    <div id="queueList"></div>
  </div>
</main>

<script>
(() => {
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const queueList = document.getElementById('queueList');
  let queue = []; // {id, file, name, srcUrl, w, h, status, outBlob, outName, outFormat, error}
  let idc = 1;
  let outputFormat = 'jpeg';

  document.getElementById('formatGrid').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    outputFormat = b.dataset.fmt;
    document.querySelectorAll('#formatGrid button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });

  const qualityEl = document.getElementById('quality');
  qualityEl.addEventListener('input', ()=> document.getElementById('v-quality').textContent = qualityEl.value+'%');

  ['dragover','dragenter'].forEach(ev=> dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.style.borderColor='var(--accent)'; }));
  ['dragleave','drop'].forEach(ev=> dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.style.borderColor='var(--line)'; }));
  dropzone.addEventListener('drop', e=>{
    const files = Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
    addFiles(files);
  });

  fileInput.addEventListener('change', e=>{ addFiles(Array.from(e.target.files)); e.target.value=''; });

  function addFiles(files){
    files.forEach(file=>{
      const id = 'F'+(idc++);
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const q = queue.find(x=>x.id===id);
        if(q){ q.w = img.naturalWidth; q.h = img.naturalHeight; renderQueue(); }
      };
      img.src = url;
      queue.push({ id, file, name:file.name, srcUrl:url, w:0, h:0, status:'queued', outBlob:null, outName:null, error:null });
    });
    renderQueue();
    document.getElementById('convertBtn').disabled = queue.length===0;
  }

  function renderQueue(){
    queueList.innerHTML = '';
    queue.forEach(q=>{
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <img src="${q.srcUrl}">
        <div class="info">
          <div class="name">${escapeHtml(q.name)}</div>
          <div class="meta">${q.w?`${q.w}×${q.h} · `:''}${(q.file.size/1024).toFixed(0)} KB${q.error?' · '+escapeHtml(q.error):''}</div>
        </div>
        <span class="status ${q.status}">${q.status}</span>
        ${q.status==='complete' ? `<button class="dl" data-id="${q.id}">Download</button>` : ''}
      `;
      const dlBtn = el.querySelector('.dl');
      if(dlBtn) dlBtn.addEventListener('click', ()=> downloadOne(q.id));
      queueList.appendChild(el);
    });
    document.getElementById('summary').textContent = queue.length ? `${queue.length} file(s) in queue` : '';
  }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // ---------- Real conversion pipeline ----------
  const MIME = { jpeg:'image/jpeg', png:'image/png', webp:'image/webp', bmp:null };
  const EXT = { jpeg:'jpg', png:'png', webp:'webp', bmp:'bmp' };

  async function convertOne(q){
    q.status = 'processing'; renderQueue();
    try{
      const img = await loadImage(q.srcUrl);
      let w = img.naturalWidth, h = img.naturalHeight;
      const rw = Number(document.getElementById('resizeW').value);
      const rh = Number(document.getElementById('resizeH').value);
      const keepAspect = document.getElementById('keepAspect').checked;
      if(rw && rh && !keepAspect){ w = rw; h = rh; }
      else if(rw){ h = Math.round(img.naturalHeight * (rw/img.naturalWidth)); w = rw; }
      else if(rh){ w = Math.round(img.naturalWidth * (rh/img.naturalHeight)); h = rh; }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const cx = canvas.getContext('2d');
      if(outputFormat==='jpeg'){ cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); } // flatten transparency for JPG
      cx.drawImage(img, 0, 0, w, h);

      let blob;
      if(outputFormat==='bmp'){
        blob = canvasToBMP(cx, w, h);
      } else {
        const quality = Number(qualityEl.value)/100;
        blob = await new Promise(res => canvas.toBlob(res, MIME[outputFormat], quality));
        if(!blob) throw new Error('Browser could not encode this format.');
      }
      q.outBlob = blob;
      q.outName = stripExt(q.name) + '.' + EXT[outputFormat];
      q.status = 'complete';
      q.outW = w; q.outH = h;
    } catch(err){
      q.status = 'failed';
      q.error = err.message || String(err);
    }
    renderQueue();
  }

  function loadImage(url){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = ()=>reject(new Error('Failed to decode image'));
      img.src = url;
    });
  }
  function stripExt(name){ return name.replace(/\.[^.]+$/, ''); }

  // Real BMP encoder (24-bit uncompressed) built from actual canvas pixel data — not a renamed file.
  function canvasToBMP(ctx, w, h){
    const imgData = ctx.getImageData(0,0,w,h).data;
    const rowSize = Math.floor((24*w+31)/32)*4;
    const pixelArraySize = rowSize*h;
    const fileSize = 54 + pixelArraySize;
    const buf = new ArrayBuffer(fileSize);
    const view = new DataView(buf);
    // BITMAPFILEHEADER
    view.setUint8(0,0x42); view.setUint8(1,0x4D); // 'BM'
    view.setUint32(2, fileSize, true);
    view.setUint32(6, 0, true);
    view.setUint32(10, 54, true);
    // BITMAPINFOHEADER
    view.setUint32(14, 40, true);
    view.setInt32(18, w, true);
    view.setInt32(22, h, true); // positive = bottom-up
    view.setUint16(26, 1, true);
    view.setUint16(28, 24, true);
    view.setUint32(30, 0, true);
    view.setUint32(34, pixelArraySize, true);
    view.setInt32(38, 2835, true);
    view.setInt32(42, 2835, true);
    view.setUint32(46, 0, true);
    view.setUint32(50, 0, true);
    let offset = 54;
    for(let y=h-1; y>=0; y--){
      for(let x=0; x<w; x++){
        const si = (y*w+x)*4;
        view.setUint8(offset++, imgData[si+2]); // B
        view.setUint8(offset++, imgData[si+1]); // G
        view.setUint8(offset++, imgData[si]);   // R
      }
      const pad = rowSize - w*3;
      for(let p=0;p<pad;p++) view.setUint8(offset++, 0);
    }
    return new Blob([buf], { type:'image/bmp' });
  }

  document.getElementById('convertBtn').addEventListener('click', async ()=>{
    document.getElementById('convertBtn').disabled = true;
    for(const q of queue){ await convertOne(q); }
    document.getElementById('convertBtn').disabled = false;
    document.getElementById('downloadAllBtn').disabled = !queue.some(q=>q.status==='complete');
  });

  function downloadOne(id){
    const q = queue.find(x=>x.id===id);
    if(!q || !q.outBlob) return;
    const url = URL.createObjectURL(q.outBlob);
    const a = document.createElement('a');
    a.href = url; a.download = q.outName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    addHistoryEntry({ filename:q.outName, operation:'Image Conversion', outputFormat:outputFormat.toUpperCase(), dimensions:`${q.outW}×${q.outH}`, status:'Complete' });
  }

  document.getElementById('downloadAllBtn').addEventListener('click', async ()=>{
    const done = queue.filter(q=>q.status==='complete' && q.outBlob);
    if(!done.length) return;
    const entries = [];
    for(const q of done){ entries.push({ name:q.outName, data: new Uint8Array(await q.outBlob.arrayBuffer()) }); }
    const zipBlob = buildZip(entries);
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = 'converted-images.zip';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    done.forEach(q=> addHistoryEntry({ filename:q.outName, operation:'Batch Image Conversion', outputFormat:outputFormat.toUpperCase(), dimensions:`${q.outW}×${q.outH}`, status:'Complete' }));
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    queue.forEach(q=>URL.revokeObjectURL(q.srcUrl));
    queue = [];
    renderQueue();
    document.getElementById('convertBtn').disabled = true;
    document.getElementById('downloadAllBtn').disabled = true;
  });

  // ---------- Minimal real ZIP writer (store/no-compression method, valid PKZIP format) ----------
  function crc32(data){
    let c, crc = 0xFFFFFFFF;
    for(let i=0;i<data.length;i++){
      c = (crc ^ data[i]) & 0xFF;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function buildZip(entries){
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const encoder = new TextEncoder();
    for(const entry of entries){
      const nameBytes = encoder.encode(entry.name);
      const crc = crc32(entry.data);
      const size = entry.data.length;

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0, true);
      local.setUint16(8, 0, true); // stored, no compression
      local.setUint16(10, 0, true);
      local.setUint16(12, 0, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);
      local.setUint32(22, size, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      localParts.push(new Uint8Array(local.buffer), nameBytes, entry.data);

      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, 0, true);
      central.setUint16(10, 0, true);
      central.setUint16(12, 0, true);
      central.setUint16(14, 0, true);
      central.setUint32(16, crc, true);
      central.setUint32(20, size, true);
      central.setUint32(24, size, true);
      central.setUint16(28, nameBytes.length, true);
      central.setUint16(30, 0, true);
      central.setUint16(32, 0, true);
      central.setUint16(34, 0, true);
      central.setUint16(36, 0, true);
      central.setUint32(38, 0, true);
      central.setUint32(42, offset, true);
      centralParts.push(new Uint8Array(central.buffer), nameBytes);

      offset += 30 + nameBytes.length + size;
    }
    const centralStart = offset;
    let centralSize = 0;
    for(let i=0;i<centralParts.length;i+=2) centralSize += centralParts[i].length + centralParts[i+1].length;

    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, centralStart, true);
    end.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(end.buffer)], { type:'application/zip' });
  }

  // ---------- Shared local history (localStorage) ----------
  function addHistoryEntry(entry){
    try{
      const key = 'app_history_v1';
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.unshift({ id:'H'+Date.now()+Math.random().toString(36).slice(2,7), timestamp:new Date().toISOString(), ...entry });
      localStorage.setItem(key, JSON.stringify(list.slice(0,300)));
    }catch(e){ /* localStorage unavailable — history simply won't record */ }
  }

  window.__converterTestHooks = { getQueue:()=>queue, addFiles, convertOne, buildZip, crc32, canvasToBMP };
})();
</script>
</body>
</html>
